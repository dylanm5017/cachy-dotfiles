# Smoky Plum Night — Hyprland preview for cachyos-x8664
# Generated from tokens/smoky-plum.tokens.json v0.1.0; do not edit by hand.
# Preview artifact only: this file is not applied to live user config.

$mod = SUPER
$terminal = alacritty
$launcher = rofi -show drun
$browser = firefox
$editor = code
$fileManager = dolphin
$screenshot = ~/.local/bin/hypr-screenshot

monitor = DP-1, 1920x1080@60, 0x0, 1
monitor = DP-2, 5120x1440@119.97, 1920x0, 1
monitor = , preferred, auto, 1

workspace = 1, monitor:DP-2, default:true
workspace = 2, monitor:DP-2
workspace = 3, monitor:DP-2
workspace = 4, monitor:DP-2
workspace = 5, monitor:DP-2
workspace = 6, monitor:DP-2
workspace = 7, monitor:DP-2
workspace = 8, monitor:DP-2
workspace = 9, monitor:DP-2
workspace = 10, monitor:DP-1, default:true

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = MOZ_ENABLE_WAYLAND,1
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = QS_ICON_THEME,Tela-purple-dark
env = QT_QPA_PLATFORMTHEME,qt6ct
envd = XDG_CURRENT_DESKTOP,Hyprland
envd = XDG_SESSION_DESKTOP,Hyprland
envd = XDG_SESSION_TYPE,wayland

exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user start hyprpolkitagent.service
# exec-once = hyprpaper  # replaced by quickshell wallpaper domain (upstream this to design-system hyprland template)
exec-once = hypridle
exec-once = qs -n -p ~/Projects/quickshell

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

cursor {
    no_hardware_cursors = false
}

general {
    gaps_in = 5
    gaps_out = 8
    border_size = 1
    col.active_border = rgba(ff4a74ff) rgba(e9ddffff) 45deg
    col.inactive_border = rgba(31263ccc)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 6
    active_opacity = 1
    inactive_opacity = 0.96

    shadow {
        enabled = true
        range = 14
        render_power = 2
        color = rgba(00000080)
    }

    blur {
        enabled = true
        size = 4
        passes = 2
        vibrancy = 0.1
    }
}

animations {
    enabled = true
    bezier = smooth, 0.22, 1, 0.36, 1
    animation = windows, 1, 3, smooth, popin 86%
    animation = windowsOut, 1, 2, smooth, popin 86%
    animation = border, 1, 3, smooth
    animation = fade, 1, 2, smooth
    animation = workspaces, 1, 3, smooth, slidefade 10%
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

windowrule = match:class ^(pavucontrol)$, float yes
windowrule = match:class ^(pavucontrol)$, size 540 480
windowrule = match:class ^(pavucontrol)$, center yes
windowrule = match:class ^(nm-connection-editor)$, float yes
windowrule = match:class ^(blueman-manager)$, float yes
windowrule = match:class ^(org.kde.polkit-kde-authentication-agent-1)$, float yes
windowrule = match:class ^(xdg-desktop-portal-gtk)$, float yes
windowrule = match:title ^(Open File|Save File|Save As|Choose Files|Open Folder)(.*)$, float yes
windowrule = match:class ^(file-roller)$, float yes
windowrule = match:title ^(Picture-in-Picture)$, float yes
windowrule = match:title ^(Picture-in-Picture)$, pin yes
windowrule = match:title ^(Picture-in-Picture)$, size 25% 25%
windowrule = match:title ^(Picture-in-Picture)$, move 73% 73%
windowrule = match:class ^(Alacritty)$, opacity 0.95 0.88

layerrule = match:namespace ^(quickshell)$, blur yes
layerrule = match:namespace ^(rofi)$, blur yes

bind = $mod, RETURN, exec, $terminal
bind = $mod, SPACE, exec, qs ipc -p ~/Projects/quickshell call shell toggleLauncher
bind = $mod, Tab, exec, qs ipc -p ~/Projects/quickshell call shell toggleWorkspaceOverview
bind = $mod, D, exec, $launcher
bind = $mod, B, exec, $browser
bind = $mod, C, exec, $editor
bind = $mod, E, exec, $fileManager
bind = $mod, A, exec, qs ipc -p ~/Projects/quickshell call shell toggleStation
bind = $mod, N, exec, qs ipc -p ~/Projects/quickshell call shell toggleNotifications
bind = $mod, period, exec, qs ipc -p ~/Projects/quickshell call shell toggleAmbient
bind = $mod, slash, exec, qs ipc -p ~/Projects/quickshell call shell toggleCheatsheet
bind = $mod SHIFT, N, exec, qs ipc -p ~/Projects/quickshell call shell toggleDnd
bind = $mod CTRL, Escape, exec, qs ipc -p ~/Projects/quickshell call shell powerMenu
bind = $mod CTRL, L, exec, qs ipc -p ~/Projects/quickshell call shell lock
bind = $mod, W, exec, qs ipc -p ~/Projects/quickshell call shell toggleStation
bind = $mod, I, exec, qs ipc -p ~/Projects/quickshell call shell toggleSettings
bind = $mod SHIFT, V, exec, qs ipc -p ~/Projects/quickshell call shell toggleClipboard
bind = $mod SHIFT, W, exec, qs ipc -p ~/Projects/quickshell call shell toggleWallpapers
bind = $mod CTRL, W, exec, qs ipc -p ~/Projects/quickshell call shell cycleWallpaper
bind = $mod SHIFT, Tab, exec, qs ipc -p ~/Projects/quickshell call shell toggleWindowSwitcher
bind = $mod CTRL, S, exec, qs ipc -p ~/Projects/quickshell call shell recordRegion
bind = $mod CTRL SHIFT, S, exec, qs ipc -p ~/Projects/quickshell call shell recordStop
bind = $mod SHIFT, Q, killactive,
bind = $mod SHIFT, E, exit,
bind = $mod, F, fullscreen, 0
bind = $mod, M, fullscreen, 1
bind = $mod, V, togglefloating,
bind = $mod, G, togglegroup,
bind = $mod, P, pseudo,
bind = $mod, T, layoutmsg, togglesplit
bind = $mod, grave, togglespecialworkspace, magic
bind = $mod SHIFT, grave, movetoworkspace, special:magic
bind = $mod ALT, H, resizeactive, -40 0
bind = $mod ALT, L, resizeactive, 40 0
bind = $mod ALT, K, resizeactive, 0 -40
bind = $mod ALT, J, resizeactive, 0 40
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
bind = , PRINT, exec, spectacle --new-instance --region
bind = $mod, PRINT, exec, $screenshot region-save
bind = $mod SHIFT, PRINT, exec, $screenshot region-copy
bind = $mod CTRL, PRINT, exec, $screenshot full-save
bind = $mod ALT, PRINT, exec, $screenshot full-copy
bind = $mod, S, exec, $screenshot region-copy
bind = $mod SHIFT, S, exec, $screenshot full-save
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
