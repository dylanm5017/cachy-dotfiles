# Smoky Plum Night — Hypridle config for cachyos-x8664
# Generated from tokens/smoky-plum.tokens.json v0.1.0.
#
# NOT a preview artifact, whatever the old header said: hyprland.lua starts
# `hypridle`, and hypridle reads exactly this path. It is live.
#
# Hand-edited 2026-08-09 to repair the dpms calls, and 2026-09-06 to add the
# ambient idle-screen listener. Fold these changes back into the design-system
# template or the next regeneration will re-break them.
#
# Under a LUA Hyprland config, `hyprctl dispatch` takes LUA, not the old
# keyword syntax — it wraps the argument as `return hl.dispatch(<text>)`. So
# `hyprctl dispatch dpms off` is a syntax error and exits 7. That silently
# broke the display-off listener below: the screens never blanked, and
# after_sleep_cmd never restored them. Verified working form: dpms("off").
# Note the dispatcher does NOT validate its argument — a typo'd value still
# returns "ok" and does nothing, so changes here need testing, not eyeballing.

general {
    lock_cmd = qs ipc -p /home/dyl/Projects/quickshell call shell lock || hyprlock  # quickshell locker, hyprlock fallback (upstream to design-system template)
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# The Ambient canvas as the IDLE SCREEN. It used to be a thing you pressed
# Super+W for and then never looked at; what is good about it was always
# ambient, so the trigger is absence now rather than a keystroke, and W went to
# the context panel.
#
# SET, not toggle: `ambientIdle true|false` rather than `toggleAmbient` twice. A
# toggle fired by a timeout inverts the first time the canvas is already open
# when the timeout lands, and then on-resume opens the very thing it was meant
# to close. The shell side is asymmetric to match — it yields to a canvas you
# opened yourself, and the resume edge closes only what the timeout edge opened.
#
# 300s sits well inside the 900s lock below, so the smoke is what a walk-past
# sees for the ten minutes before the lock takes the screen.
listener {
    timeout = 300
    on-timeout = qs ipc -p /home/dyl/Projects/quickshell call shell ambientIdle true
    on-resume = qs ipc -p /home/dyl/Projects/quickshell call shell ambientIdle false
}

listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# All three listeners are gated by the compositor's idle inhibitors, so none of
# them fires while a fullscreen window or a focused game is up (see the
# idle-fullscreen / idle-games window rules in hyprland.lua) — which is also
# what keeps the ambient canvas from smoking over a film or a game. Gamepad input does not reset an idle
# timer, which is what used to put a controller-only session on the lock screen.
listener {
    timeout = 1200
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}
